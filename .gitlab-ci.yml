spec:
  inputs:
    target_repo:
      type: string
      default: "github.com/mygaru/id-hash.git"
      options:
        - "github.com/mygaru/id-hash.git"
    target_branch:
      type: string
      default: "master"
      options:
        - "master"
---
stages:
  - build
  - sync

variables:
  REGISTRY: ghcr.io/mygaru/id-hash

# ---------- BUILD (runs on tag pushes) ----------
build:
  stage: build
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - echo "$GH_TOKEN" | docker login ghcr.io -u $GH_USER --password-stdin
  script:
    - TAG_COMMIT=$REGISTRY:$CI_COMMIT_TAG
    - echo "TAG_COMMIT - $TAG_COMMIT"
    - IMAGE_TAG=${TAG_COMMIT#*:}
    - echo "IMAGE_TAG=$IMAGE_TAG" >> build.env
    - docker build --pull -t $TAG_COMMIT -t $REGISTRY:latest .
    - docker push $TAG_COMMIT
    - docker push $REGISTRY:latest
  artifacts:
    reports:
      dotenv: build.env

# ---------- SYNC (manual, triggered from the UI "Run pipeline" page) ----------
sync_to_github:
  stage: sync
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never
  variables:
    SYNCIGNORE: ".syncignore"
    TARGET_REPO: "$[[ inputs.target_repo ]]"
    TARGET_BRANCH: "$[[ inputs.target_branch ]]"
  before_script:
  - git --version
  - rsync --version || (sudo apt-get update && sudo apt-get install -y rsync)
  script:
    - |
      if [ ! -f "$SYNCIGNORE" ]; then
        echo "$SYNCIGNORE not found! Stopping sync..."
        exit 1
      fi
    - TEMP_DIR=$(mktemp -d)
    - mkdir -p "$TEMP_DIR/target_repo"
    - git clone --branch "$TARGET_BRANCH" "https://${GH_USER}:${GH_TOKEN}@${TARGET_REPO}" "$TEMP_DIR/target_repo"
    - rsync -av --exclude-from="$SYNCIGNORE" --exclude ".git" "$CI_PROJECT_DIR/" "$TEMP_DIR/target_repo/"
    - git config --global user.name "Mygaru Sync"
    - git config --global user.email "sync@mygaru.com"
    - |
      cd "$TEMP_DIR/target_repo"
      git add .
      if ! git diff --cached --quiet; then
        git commit -m "Sync from GitLab ($CI_COMMIT_SHORT_SHA)"
        git push origin "$TARGET_BRANCH"
      else
        echo "No changes to commit."
      fi
    - rm -rf "$TEMP_DIR"