syntax = "proto3";

package gvl;
option go_package = "./gvl";

message VendorList {
  repeated Vendor vendors = 1;
}

// https://vendor-list.consensu.org/v3/vendor-list.json
message Vendor {
  uint32 id = 1;
  string name = 2;
  message Domain {
      string domain = 1;
      Location loc = 2;
      enum Location {
        PrivacyList = 0;
        // A lot of shitty clients on the GVL list add all known domains
        // that are not represented to them to the device storage list
        // For example: FireArc Technologies Ltd

        // NOTE: Domains from the privacy list has a priority compared to device storage list
        // Device storage list is used for cases when PrivacyList doesn't contain the processing domains (for example: spot.im - OpenWeb)
        DeviceStorageList = 1;
      }
  }
  repeated Domain domains = 3;
}
